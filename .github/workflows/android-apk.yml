name: Android APK

# 在 GitHub 云端把 android-apk/ 工程打成可安装的 APK（无需本地 Android Studio）。
#
# 产物：一个已签名（debug 证书）的 APK —— 可直接在手机上安装，并能覆盖安装旧版。
# 位置：Actions 运行页底部 Artifacts → RidgeLink-apk
#
# 说明：
#   - 仓库根目录就是 ridge-link 项目，Android 工程在 android-apk/ 子目录，
#     所以 steps 里统一用 working-directory / 路径指向它。
#   - 网页资源以 android-apk/app/src/main/assets/www/ 里的副本为准（由 sync-web 同步）。

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'android-apk/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: 'yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0"'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Build APK
        working-directory: android-apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show version and list output
        working-directory: android-apk
        run: |
          echo "== version in build.gradle =="
          grep -E "versionCode|versionName" app/build.gradle || true
          ls -lh app/build/outputs/apk/debug/

      - name: Rename APK
        working-directory: android-apk
        run: |
          VERSION=$(grep -oE "versionName +'[^']+'" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$SRC" "../RidgeLink-${VERSION:-dev}.apk"
          echo "APK => RidgeLink-${VERSION:-dev}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RidgeLink-apk
          path: RidgeLink-*.apk
          if-no-files-found: error
          retention-days: 30

plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {
    namespace 'com.ridgelink.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ridgelink.app'
        minSdk 21
        targetSdk 34
        /* 2.2：手机端 App 外壳（底部三块导航、演示页地图优先 + 底部抽屉） */
        versionCode 13
        versionName '2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}

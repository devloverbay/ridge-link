<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="山脊信使">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>山脊信使 · 应急通信指挥台</title>
<style>
    :root{
    --bg:#0d1a17;
    --bg2:#101d1a;
    --panel:rgba(20,34,30,.9);
    --line:rgba(206,236,226,.14);
    --line2:rgba(206,236,226,.26);
    --text:#e8f3ee;
    --muted:#93ada4;
    --teal:#43d0b2;
    --teal2:#0a7d74;
    --orange:#e0a877;
    --red:#d98a92;
    --blue:#78b4f0;
    --violet:#a58cf0;
    --max:1180px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    background-color:#fff;
    background-image:
      radial-gradient(44% 40% at 4% 0%, rgba(0,194,178,.55), rgba(0,194,178,0) 70%),
      radial-gradient(42% 38% at 96% 2%, rgba(59,130,246,.50), rgba(59,130,246,0) 70%),
      radial-gradient(40% 36% at 98% 98%, rgba(168,85,247,.45), rgba(168,85,247,0) 70%),
      radial-gradient(42% 38% at 2% 96%, rgba(245,158,11,.42), rgba(245,158,11,0) 70%),
      radial-gradient(48% 44% at 50% 52%, rgba(236,72,153,.16), rgba(236,72,153,0) 74%);
    background-attachment:fixed;
    background-repeat:no-repeat;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  a{color:inherit;text-decoration:none}
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(15,64,92,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(15,64,92,.07) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 78%);
  }
  .glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(100px);z-index:0}
  .glow.a{width:520px;height:520px;background:rgba(11,143,132,.09);top:-180px;right:-140px}
  .glow.b{width:460px;height:460px;background:rgba(22,104,184,.06);top:620px;left:-200px}

  .top{
    height:60px;position:relative;z-index:20;display:flex;align-items:center;gap:18px;
    margin:10px 12px 8px;padding:0 18px;
    background:rgba(255,255,255,.42);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(20,34,30,0.78);
    border-radius:16px;
    box-shadow:0 14px 34px -18px rgba(15,64,92,.34),inset 0 1px 0 rgba(20,34,30,0.9);
  }
  .top .brand{display:flex;align-items:center;gap:11px}
  .top .brand-mark{width:34px;height:34px;border-radius:10px;position:relative;flex:none;
    background:linear-gradient(145deg,rgba(11,143,132,.2),rgba(22,104,184,.13));
    border:1px solid rgba(11,143,132,.45);display:grid;place-items:center}
  .top .brand-mark svg{width:20px;height:20px;stroke:var(--teal);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .top .brand-t b{display:block;font-size:14px;letter-spacing:2px;color:#e8f3ee}
  .top .brand-t span{display:block;font-size:9px;letter-spacing:2px;color:#8fa8a0;font-weight:500}
  .top-mid{display:flex;gap:8px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .tag{
    display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    border:1px solid rgba(214,244,236,.18);background:rgba(255,255,255,.05);color:#c6d8d2;
    font-size:11px;letter-spacing:.5px;white-space:nowrap;
  }
  .tag i{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
  .tag.warn{background:rgba(216,160,106,.12);border-color:rgba(216,160,106,.3);color:#e2b184;font-weight:600}
  .tag.warn i{background:var(--orange);box-shadow:0 0 10px var(--orange)}
  .tag.grad{background:rgba(216,160,106,.12);border-color:rgba(216,160,106,.3);color:#e2b184;font-weight:600;box-shadow:none}
  .tag.grad.on{background:rgba(67,208,178,.12);border-color:rgba(67,208,178,.32);color:#6fe0c6}
  .clock{font-size:13px;color:#e8f3ee;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .fast{display:flex;align-items:center;gap:6px;font-size:11px;color:#b9cec7;letter-spacing:1px;cursor:pointer}
  .fast input{accent-color:var(--teal)}

  .stage{
    position:relative;z-index:1;height:calc(100vh - 70px);
    display:grid;grid-template-columns:288px minmax(0,1fr) 330px;
    grid-template-rows:minmax(0,1fr) 232px;gap:12px;padding:12px;
  }
  .panel{
    background:linear-gradient(165deg,rgba(20,34,30,0.82),rgba(20,34,30,0.82));
    border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;
    min-height:0;min-width:0;overflow:hidden;
  }
  .ph{
    height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:0 14px;border-bottom:1px solid var(--line);
  }
  .ph span{font-size:12px;letter-spacing:2px;color:#c6d8d2;font-weight:700}
  .ph-r{font-size:11px;color:var(--muted);letter-spacing:1px}
  .ph-r.ok{color:var(--teal)}
  .ph.sub{border-top:1px solid rgba(15,64,92,.09);border-bottom:none}
  .left{grid-row:1/3;grid-column:1}
  .map-panel{grid-row:1;grid-column:2}
  .right{grid-row:1;grid-column:3}
  .bottom{grid-row:2;grid-column:2/4}

  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;
    font-size:12.5px;font-weight:700;letter-spacing:.5px;transition:transform .2s,box-shadow .2s,border-color .2s;
    border:1px solid transparent;cursor:pointer;font-family:inherit;color:var(--text);
  }
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--teal),#0b8f84);color:#ffffff;box-shadow:0 8px 24px rgba(11,143,132,.24)}
  .btn.ghost{border:1px solid rgba(214,244,236,.2);background:rgba(255,255,255,.06);color:#e8f3ee}
  .btn.sm{padding:8px 14px;font-size:12px;border-radius:10px}
  .btn.xs{padding:5px 10px;font-size:11px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mini{font-size:10px;color:var(--muted);letter-spacing:1px}

  .left{grid-row:1/3}
  .left-scroll{flex:1;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:16px;min-height:0}
  .scn-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .scn{
    display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:11px 12px;border-radius:11px;
    border:1px solid var(--line);background:rgba(20,34,30,0.75);color:var(--text);cursor:pointer;font-family:inherit;
    transition:border-color .2s,background .2s;text-align:left;
  }
  .scn:hover{border-color:rgba(11,143,132,.4)}
  .scn.active{border-color:rgba(11,143,132,.65);background:rgba(11,143,132,.11)}
  .scn .s-ico{width:26px;height:26px;color:var(--teal)}
  .scn b{font-size:12.5px;letter-spacing:1px}
  .scn span{font-size:10px;color:var(--muted);letter-spacing:.5px}
  .block-h{font-size:11px;letter-spacing:2px;color:#c6d8d2;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .block-h::after{content:"";flex:1;height:1px;background:var(--line);margin-left:12px}
  .evt{border:1px solid var(--line);border-radius:11px;padding:12px;background:rgba(20,34,30,0.76)}
  .evt h4{margin:0 0 6px;font-size:14px;letter-spacing:1px}
  .evt p{margin:0;color:var(--muted);font-size:12px;line-height:1.85}
  .evt .meta{display:flex;flex-direction:column;gap:4px;margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
  .evt .meta i{font-style:normal;font-size:11px;color:#07867c;letter-spacing:.5px}
  .vlist{display:flex;flex-direction:column;gap:6px}
  .vrow{
    display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;width:100%;text-align:left;
    padding:8px 9px;border-radius:9px;border:1px solid transparent;background:rgba(20,34,30,0.7);
    color:var(--text);cursor:pointer;font-family:inherit;font-size:12px;
  }
  .vrow:hover{border-color:var(--line2)}
  .vrow.sel{border-color:rgba(11,143,132,.5);background:rgba(11,143,132,.1)}
  .vrow.dim{opacity:.55}
  .vdot{width:8px;height:8px;border-radius:50%}
  .vdot.s0{background:#0b8f84}.vdot.s1{background:#bf6a10}.vdot.s2{background:#c1626b}
  .vrow .vname{font-size:12px;letter-spacing:.5px}
  .vrow .vpop{font-size:10px;color:var(--muted);margin-top:2px}
  .vstat{font-size:10px;letter-spacing:.5px;padding:3px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
  .vstat.i2{color:#9a5058;background:rgba(193,98,107,.12);border-color:rgba(193,98,107,.35)}
  .vstat.i1{color:#8f4f10;background:rgba(191,106,16,.12);border-color:rgba(191,106,16,.35)}
  .vstat.i0{color:#0a8a7e;background:rgba(11,143,132,.11);border-color:rgba(11,143,132,.32)}
  .vprio{font-size:10px;font-weight:800;color:var(--teal);border:1px solid rgba(11,143,132,.4);border-radius:5px;padding:2px 6px}
  .vdet{border-top:1px dashed var(--line);margin-top:2px;padding-top:8px;font-size:11px;color:var(--muted);line-height:1.8}
  .vdet b{color:#c6d8d2;font-weight:600}
  .res{display:flex;flex-wrap:wrap;gap:6px}
  .reschip{font-size:10.5px;color:#c6d8d2;border:1px solid var(--line2);background:rgba(15,64,92,.05);padding:4px 8px;border-radius:6px;letter-spacing:.5px}

  .map-panel{display:flex;flex-direction:column}
  .kpis{display:flex;gap:6px}
  .kpi{flex:1;min-width:0;border-left:1px solid var(--line2);padding-left:8px}
  .kpi:first-child{padding-left:0;border-left:none}
  .kpi span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:1px}
  .kpi b{font-size:16px;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:.5px}
    .map-stage{position:relative;flex:1;min-height:0;background:#0b1714;overflow:hidden;
  touch-action:none;cursor:grab;user-select:none}
  .map-stage.is-dragging{cursor:grabbing}
  .map-pan{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
  #terrain{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
  #mapSvg{position:absolute;inset:0;width:100%;height:100%}
  #mapSvg .ct{fill:none;stroke:rgba(206,236,226,.12);stroke-width:1}
  #mapSvg .ct.hot{stroke:rgba(67,208,178,.22)}
  #mapSvg .riv{stroke:rgba(120,180,240,.45);stroke-width:2;fill:none;stroke-dasharray:1 6}
  #mapSvg .lnk{fill:none;stroke-width:2;stroke-dasharray:7 6;animation:flow 1.1s linear infinite}
  #mapSvg .lnk.micro{stroke:#1668b8;stroke-dasharray:2 6}
  #mapSvg .lnk.relay{stroke:#0b8f84}
  #mapSvg .lnk.sat{stroke:#6d4fd0;stroke-dasharray:3 5}
  #mapSvg .lnk.pdt{stroke:#bf6a10;stroke-dasharray:5 4}
  #mapSvg .lnk.beidou{stroke:#93ada4;stroke-dasharray:1 5;stroke-linecap:round}
  @keyframes flow{to{stroke-dashoffset:-28}}
  .stn .ico{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .stn .cov{fill:rgba(11,143,132,.08);stroke:rgba(11,143,132,.18);stroke-width:1.5;stroke-dasharray:3 3}
  .stn.down .ico{stroke:#c1626b}
  .stn.down .cov{fill:rgba(193,98,107,.07);stroke:rgba(193,98,107,.4);stroke-dasharray:4 4}
  .stn .halo{fill:rgba(11,143,132,.2)}
  .stn .halo.down{fill:rgba(193,98,107,.18)}
  .stn .lb{fill:#dcebe4;font-size:11px;font-weight:700;font-family:inherit;letter-spacing:1px}
  .stn .lb2{fill:var(--muted);font-size:9.5px;font-family:inherit}
  .stn.down .lb,.stn.down .lb2{fill:#9a5058}
  .cp-ico{fill:#0d3a52;stroke:1.6}
  .vnode circle.dot{fill:#ffffff;stroke-width:2.4}
  .vnode.s2 circle.dot{stroke:var(--red)}
  .vnode.s1 circle.dot{stroke:var(--orange)}
  .vnode.s0 circle.dot{stroke:var(--teal)}
  .vnode circle.pulse{fill:rgba(11,143,132,.1);stroke:rgba(11,143,132,.32);stroke-width:1}
  .vnode.s2 circle.pulse{fill:rgba(193,98,107,.09);stroke:rgba(193,98,107,.3)}
  .vnode.s1 circle.pulse{fill:rgba(191,106,16,.09);stroke:rgba(191,106,16,.3)}
  .vnode .vdoti{width:10px;height:10px;border-radius:50%;fill:#ffffff;stroke-width:2}
  .vnode.s2 .vdoti{fill:var(--red);stroke:#9a5058}
  .vnode.s1 .vdoti{fill:var(--orange);stroke:#8f4f10}
  .vnode.s0 .vdoti{fill:var(--teal);stroke:#0a8a7e}
  .vnode .prio{fill:var(--teal);stroke:#ffffff}
  .vnode.vsel circle.dot,.vnode.vsel circle.pulse{stroke:var(--teal);stroke-width:2.4}
  .vnode.vsel .vdoti{fill:var(--teal)}
  .droid-pulse{fill:none;stroke:var(--teal);stroke-width:1.6;stroke-dasharray:3 4;animation:spin 2.4s linear infinite}
  @keyframes spin{to{stroke-dashoffset:-20}}
  .sat-ico{fill:#f1ecfd;stroke:#6d4fd0;stroke-width:1.6}
  .sat rect{fill:#f1ecfd}
  .legend{
    position:absolute;left:12px;bottom:66px;display:flex;gap:14px;flex-wrap:wrap;
    padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(20,34,30,0.78);
    backdrop-filter:blur(8px);font-size:10.5px;color:var(--muted);letter-spacing:.5px;
  }
  .legend b{color:var(--text);font-weight:600}
  .map-prog{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 12px;background:linear-gradient(transparent,rgba(20,34,30,0.88))}
  .stages{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .stage-p{font-size:10px;letter-spacing:1.5px;color:#93ada4;padding:3px 9px;border-radius:999px;border:1px solid var(--line);transition:all .3s;white-space:nowrap}
  .stage-p.on{color:#ffffff;background:var(--teal);border-color:var(--teal);font-weight:700}
  .stage-p.do{color:#0a8a7e;background:rgba(11,143,132,.13);border-color:rgba(11,143,132,.4)}
  .bar{height:3px;border-radius:3px;background:rgba(15,64,92,.15);overflow:hidden}
  .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--teal),#0d8f7f);border-radius:3px;transition:width .5s}

  .right{flex:1;min-height:0}
  .agents{flex:1;overflow-y:auto;padding:12px 12px 4px;display:flex;flex-direction:column;gap:9px;min-height:0}
  .agent{
    border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:rgba(20,34,30,0.72);
    transition:all .3s;
  }
  .agent.running{border-color:rgba(11,143,132,.55);background:rgba(11,143,132,.08)}
  .agent.done{border-color:rgba(11,143,132,.35)}
  .agent .a-top{display:flex;align-items:center;gap:8px}
  .agent .a-idx{font-size:10px;color:var(--teal);font-weight:800;border:1px solid rgba(11,143,132,.4);border-radius:5px;padding:1px 5px}
  .agent b{font-size:12px;letter-spacing:1px;flex:1}
  .agent .a-st{font-size:9.5px;color:var(--orange);letter-spacing:1px}
  .agent.done .a-st{color:var(--teal)}
  .agent .a-desc{font-size:10px;color:var(--muted);margin:5px 0 7px;letter-spacing:.5px}
  .agent .a-bar{height:3px;border-radius:3px;background:rgba(15,64,92,.13);overflow:hidden}
  .agent .a-bar i{display:block;height:100%;width:0%;background:var(--teal);border-radius:3px;transition:width .4s}
  .agent.done .a-bar i{width:100%}
  .agent .a-out{margin-top:7px;font-size:10.5px;color:#c6d8d2;line-height:1.6;border-top:1px dashed var(--line);padding-top:7px;min-height:44px}
  .log{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
  .ln{display:flex;gap:8px;font-size:11px;line-height:1.75;animation:slidein .25s}
  @keyframes slidein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .ln .lt{color:#93ada4;font-variant-numeric:tabular-nums;flex:none}
  .ln .lw{flex:none;color:var(--teal);letter-spacing:.5px;min-width:62px;font-weight:700}
  .ln .lm{color:var(--muted);word-break:break-all}
  .ln.sys .lw{color:#93ada4}
  .ln.ok .lm{color:#07756d}

  .bottom{display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;align-items:center;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .tab{
    padding:7px 13px;border:1px solid transparent;border-bottom:none;border-radius:9px 9px 0 0;
    background:transparent;color:var(--muted);font-size:12px;letter-spacing:1px;cursor:pointer;font-family:inherit;
  }
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--bg2);border-color:var(--line);color:var(--teal);position:relative;top:1px}
  .tab-body{flex:1;min-height:0;overflow:hidden;position:relative;display:flex}
  .tab-pane{display:none;flex:1;flex-direction:column;min-height:0;overflow:hidden}
  .tab-pane.active{display:flex}
  .pane-h{
    flex:none;height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:0 14px;border-bottom:1px solid var(--line);
  }
  .pane-h span{font-size:11px;letter-spacing:2px;color:#c6d8d2;font-weight:700}
  .pane-body{flex:1;overflow:auto;padding:12px 14px;min-height:0}
  .empty{font-size:12px;color:var(--muted);letter-spacing:1px;padding:34px 10px;text-align:center;line-height:2.6}

  .tbl{width:100%;border-collapse:collapse;font-size:11.5px}
  .tbl th{
    text-align:left;color:var(--muted);font-weight:500;font-size:10px;letter-spacing:1.5px;
    padding:7px 9px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#13211d;z-index:2;white-space:nowrap;
  }
  .tbl td{padding:8px 9px;border-bottom:1px solid rgba(15,64,92,.09);color:#c6d8d2;vertical-align:top;line-height:1.7}
  .tbl tr:last-child td{border-bottom:none}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .chip{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;letter-spacing:.5px;border:1px solid var(--line2);white-space:nowrap}
  .chip.micro{color:#14568f;border-color:rgba(22,104,184,.4);background:rgba(22,104,184,.1)}
  .chip.relay{color:#0a8a7e;border-color:rgba(11,143,132,.4);background:rgba(11,143,132,.1)}
  .chip.sat{color:#5b3fb8;border-color:rgba(109,79,208,.4);background:rgba(109,79,208,.1)}
  .chip.pdt{color:#8f4f10;border-color:rgba(191,106,16,.4);background:rgba(191,106,16,.09)}
  .chip.beidou{color:#c6d8d2;border-color:rgba(74,101,120,.4);background:rgba(15,64,92,.07)}
  .ok{color:var(--teal)}
  .warn2{color:#8f4f10}
  .bad{color:#9a5058}

  .task-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:760px){.task-grid{grid-template-columns:1fr}}
  .task{border:1px solid var(--line);border-radius:11px;padding:12px;background:rgba(20,34,30,0.72);position:relative;overflow:hidden}
  .task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--teal)}
  .task .t-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

const BASE_H=400;
function distToSeg(x,y,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;
  const t=l?Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/l)):0;
  const px=ax+t*dx,py=ay+t*dy;
  return Math.hypot(x-px,y-py);
}
function T(x,y){
  let h=BASE_H;
  for(const p of PEAKS){const dx=x-p.x,dy=y-p.y;h+=p.h*Math.exp(-(dx*dx+dy*dy)/(2*p.s*p.s));}
  for(const river of RIVERS){
    let dmin=1e9;
    for(let i=0;i<river.length-1;i++){dmin=Math.min(dmin,distToSeg(x,y,river[i][0],river[i][1],river[i+1][0],river[i+1][1]));}
    if(dmin<80){h-=250*Math.exp(-(dmin*dmin)/(2*45*45));}
  }
  return Math.max(160,h);
}
function los(a,b,hA,hB,fGHz){
  const dKm=Math.hypot(b.x-a.x,b.y-a.y)*KMPP;
  const N=120;
  let minClear=1e9;
  for(let i=1;i<N;i++){
    const t=i/N,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
    const hTer=T(x,y),d1=dKm*t,d2=dKm*(1-t),curv=(d1*d2*1000)/(2*8495);
    const clear=(hA+(hB-hA)*t)-hTer-curv;
    if(clear<minClear)minClear=clear;
  }
  const f=Math.max(dKm,0.001);
  const fresnel=17.32*Math.sqrt((f/2)*(f/2)/(fGHz*f));
  return {dKm,minClear,fresnel,blocked:minClear<0,good:minClear>=0.6*fresnel};
}
function fspl(dKm,fMHz){return 32.44+20*Math.log10(fMHz)+20*Math.log10(Math.max(dKm,0.05));}

  micro:{name:'微波',f:5800,ptx:23,gtx:24,grx:24,sens:-75,bw:'20 Mbps'},

function budget(type,dKm){
  const t=LINK_TYPES[type];
  const loss=fspl(dKm,t.f);
  const rx=t.eirp!==undefined?t.eirp-loss+t.grx:t.ptx+t.gtx+t.grx-loss;
  const margin=rx-t.sens;
  return {loss,rx,margin,type,dKm};
}

function renderContours(){
  const g=$('#gContour');g.innerHTML='';
  const cols=97,rowsN=60,cw=MAP_W/cols,ch=MAP_H/rowsN;
  const H=[];for(let j=0;j<=rowsN;j++){const arr=[];for(let i=0;i<=cols;i++){arr.push(T(i*cw,j*ch));}H.push(arr);}
  const TABLE={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,0],[1,2]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[2,0]],10:[[0,1],[2,3]],11:[[2,1]],12:[[1,3]],13:[[1,0]],14:[[0,3]]};
  const edgePt=(e,i,j,lv)=>{
    const h00=H[j][i],h10=H[j][i+1],h11=H[j+1][i+1],h01=H[j+1][i];
    const x=i*cw,y=j*ch;
    if(e===0){const t2=(lv-h00)/(h10-h00||1);return {x:x+t2*cw,y:y};}
    if(e===1){const t2=(lv-h10)/(h11-h10||1);return {x:x+cw,y:y+t2*ch};}
    if(e===2){const t2=(lv-h11)/(h01-h11||1);return {x:x+t2*cw,y:y+ch};}
    const t2=(lv-h01)/(h00-h01||1);return {x:x,y:y+t2*ch};
  };
  for(let lv=300;lv<=1800;lv+=150){
    const parts=[];
    for(let j=0;j<rowsN;j++)for(let i=0;i<cols;i++){
      const h00=H[j][i],h10=H[j][i+1],h11=H[j+1][i+1],h01=H[j+1][i];
      let c=0;if(h00>lv)c|=1;if(h10>lv)c|=2;if(h11>lv)c|=4;if(h01>lv)c|=8;
      if(c===0||c===15)continue;
      const get=(e,l)=>edgePt(e,i,j,l);
      const [a,b]=TABLE[c][0];
      parts.push('M'+get(a,lv).x.toFixed(1)+' '+get(a,lv).y.toFixed(1)+'L'+get(b,lv).x.toFixed(1)+' '+get(b,lv).y.toFixed(1));
      if(TABLE[c][1])for(const pr of TABLE[c][1]){const p1=get(pr[0],lv),p2=get(pr[1],lv);parts.push('M'+p1.x.toFixed(1)+' '+p1.y.toFixed(1)+'L'+p2.x.toFixed(1)+' '+p2.y.toFixed(1));}
    }
    g.innerHTML+='<path class="ct'+(lv%450===0?' hot':'')+'" d="'+parts.join('')+'"/>';
  }
}

function paintTerrain(){
  const cv=$('#terrain');
  const W=480,H=300;
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(W,H);
  const L=[-0.52,-0.62,0.59];
  for(let py=0;py<H;py++)for(let px=0;px<W;px++){
    const x=px*(MAP_W/W),y=py*(MAP_H/H);
    const h=T(x,y);
    const d=3;
    const dzdx=(T(x+d,y)-T(x-d,y))/(2*d*KMPP*1000);
    const dzdy=(T(x,y+d)-T(x,y-d))/(2*d*KMPP*1000);
    const nx=-dzdx,ny=-dzdy,nz=1;
    const len=Math.hypot(nx,ny,nz);
    const sh=Math.max(0,Math.min(1,0.35+((nx*L[0]+ny*L[1]+nz*L[2])/len)*0.85));
    const e=Math.max(0,Math.min(1,(h-250)/1500));
    const r=16+e*14,g=30+e*12,b=27+e*10;
    const i=(py*W+px)*4;
    const k=.72+sh*.5;
    img.data[i]=r*k;img.data[i+1]=g*k;img.data[i+2]=b*k;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const grd=ctx.createRadialGradient(W*0.5,H*0.45,10,W*0.5,H*0.5,W*0.75);
  grd.addColorStop(0,'rgba(11,143,132,.08)');
  grd.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
}

    +'</g>';

const STATUS_CACHE={};
function computeStatus(sc){
  if(STATUS_CACHE[sc.key]) return STATUS_CACHE[sc.key];
  const out={};
  const link=(st,v)=>los(st,{x:v.x,y:v.y},T(st.x,st.y)+25,T(v.x,v.y)+10,1.8);
  for(const id of Object.keys(VILLAGES)){
    const v=VILLAGES[id];
    let home=null;
    for(const sid of Object.keys(STATIONS)){
      const st=STATIONS[sid];
      const d=Math.hypot(st.x-v.x,st.y-v.y)*KMPP;
      if(!home||d<home.d) home={sid:sid,st:st,d:d};
    }
    const l0=link(home.st,v);
    const homeUp=sc.stationDown.indexOf(home.sid)<0;
    if(homeUp&&l0.good&&home.d<=5.5){
      out[id]={st:0,sid:home.sid,d:home.d,clear:l0.minClear,fres:l0.fresnel,src:"home"};
      continue;
    }
    let backup=null;
    for(const sid of Object.keys(STATIONS)){
      if(sid===home.sid||sc.stationDown.indexOf(sid)>=0) continue;
      const st=STATIONS[sid];
      const d=Math.hypot(st.x-v.x,st.y-v.y)*KMPP;
      if(d>9) continue;
      const l=link(st,v);
      if(l.blocked) continue;
      const score=(l.good?2:1)*100-d;
      if(!backup||score>backup.score) backup={sid:sid,d:d,l:l,score:score};
    }
    if(!backup){
      out[id]={st:2,sid:null,d:home.d,clear:l0.minClear,fres:l0.fresnel,src:"none",homeSid:home.sid};
    }else{
      out[id]={st:1,sid:backup.sid,d:backup.d,clear:backup.l.minClear,fres:backup.l.fresnel,src:"backup",homeSid:home.sid};
    }
  }
  STATUS_CACHE[sc.key]=out;
  return out;
}
function affectedIds(sc){
  const s=computeStatus(sc);
  const down=[],weak=[];
  for(const id of Object.keys(s)){
    if(s[id].st===2) down.push(id);
    else if(s[id].st===1) weak.push(id);
  }
  return {down:down,weak:weak,all:down.concat(weak)};
}
function statusOf(id,sc){ const s=computeStatus(sc); return s[id]?s[id].st:0; }

const METHOD_NAME={micro:'微波直连',relay:'无人机中继',sat:'卫星便携站',pdt:'PDT 集群',beidou:'北斗短报文'};

/* ================== 推理核心 ================== */
function analyze(sc){
  const cp={x:85,y:300};
  const cpAlt=T(cp.x,cp.y)+35;
  const ids=affectedIds(sc).all;
  const cov=computeStatus(sc);
  const rows=[];
  for(const id of ids){
    const v=VILLAGES[id];
    const det=sc.details[id]||{};
    const vAlt=T(v.x,v.y)+10;
    const l=los(cp,{x:v.x,y:v.y},cpAlt,vAlt,5.8);
    const down=cov[id].st===2;
    const sev=down?(v.pop>=1000?3:2):1;
    const prio=v.pop*(sev===3?1.5:sev===2?1.15:0.8);
    rows.push({v:v,id:id,status:down?'中断':'弱覆盖',det:det,sev:sev,prio:prio,direct:l,vAlt:vAlt,cover:cov[id]});
  }
  rows.sort((a,b)=>b.prio-a.prio);
  rows.forEach((r,i)=>{r.rank=i+1;r.p=r.rank<=1?'P1':r.rank<=2?'P2':r.rank<=4?'P3':'P4';});
  const relays=RELAY_POINTS.map(rp=>{
    const alt=T(rp.x,rp.y)+120;
    const covered=[];let pop=0;
    for(const r of rows){
      if(r.status==='中断'){
        const dKm=Math.hypot(rp.x-r.v.x,rp.y-r.v.y)*KMPP;
        if(dKm<=6.5){const l=los(rp,{x:r.v.x,y:r.v.y},alt,r.vAlt,1.8);if(l.good){covered.push(r.v.id);pop+=r.v.pop;}}
      }
    }
    return {id:rp.id,name:rp.name,x:rp.x,y:rp.y,alt,covered,pop,n:covered.length};
  }).sort((a,b)=>b.pop-a.pop);
  return {cp,cpAlt,rows,relays};
}

function buildLink(r){
  let L={};
  if(r.method==='micro'){
    const b=budget('micro',r.direct.dKm);
    L={type:'micro',freq:'5.8 GHz',bw:'20 Mbps',margin:b.margin,rx:b.rx,dKm:r.direct.dKm,direct:r.direct,clear:r.direct.minClear,fresnel:r.direct.fresnel};
  }else if(r.method==='relay'){
    const b=budget('lte',r.relayD);
    L={type:'relay',freq:'1.8 GHz',bw:'20 Mbps',margin:b.margin,rx:b.rx,dKm:r.relayD,direct:null,clear:r.relayClear==null?null:r.relayClear,fresnel:r.relayFres==null?null:r.relayFres,note:'卫星回传 21 dB'};
  }else if(r.method==='sat'){
    const b=budget('sat',36000);
    L={type:'sat',freq:'1.6 GHz',bw:'2 Mbps',margin:b.margin,rx:b.rx,dKm:36000,direct:null};
  }else if(r.method==='pdt'){
    const b=budget('pdt',2.5);
    L={type:'pdt',freq:'350 MHz',bw:'9.6 kbps',margin:b.margin,rx:b.rx,dKm:2.5,direct:null};
  }else{
    L={type:'beidou',freq:'北斗短包',bw:'140 B',margin:null,dKm:null,direct:null};
  }
  return L;
}
function buildPlan(sc,a){
  const plan={relayUsed:false,rows:[],relay:null};
  let satLeft=sc.resources.satellite,pdtLeft=sc.resources.pdt;
  const best=(a&&a.relays&&a.relays.length)?a.relays[0]:null;
  let covered=new Set();
  if(best&&best.covered.length){covered=new Set(best.covered);plan.relayUsed=true;plan.relay=best;}
  for(const r of a.rows){
    r.method=null;r.link=null;r.relayD=null;
    if(r.status==='弱覆盖'){
      if(pdtLeft>=2){r.method='pdt';pdtLeft-=2;}else{r.method='beidou';}
    }else if(r.direct&&r.direct.good&&r.direct.dKm<=22){r.method='micro';}
    else if(covered.has(r.id)){
      r.method='relay';r.relayD=Math.hypot(best.x-r.v.x,best.y-r.v.y)*KMPP;
      const lr=los({x:best.x,y:best.y},{x:r.v.x,y:r.v.y},T(best.x,best.y)+60,T(r.v.x,r.v.y)+10,1.8);
      r.relayClear=lr.minClear;r.relayFres=lr.fresnel;
    }
    else if(satLeft>0){r.method='sat';satLeft--;}
    else{r.method='beidou';}
    r.link=buildLink(r);
  }
  plan.rows=a.rows;
  return plan;
}
function buildTasks(sc,plan){
  const tasks=[];
  const baseEta=d=>Math.round(16+d*2.7+(sc.weatherPen||0)+(sc.roadsBlocked.length?14:0));
  if(plan.relayUsed){
    const best=plan.relay;
    tasks.push({t:'drone',k:'中继',title:'系留无人机中继升空',target:best.name,t0:best.covered.map(id=>VILLAGES[id].name).join('、'),eta:baseEta(Math.max(Math.hypot(85-best.x,300-best.y)*KMPP,12)),res:'系留无人机 ×1',note:'4G 微基站搭载卫星回传，覆盖失联村寨。'});
  }
  for(const r of plan.rows.filter(r=>r.method==='sat')){
    tasks.push({t:'sat',k:'卫星',title:'卫星便携站开通通信',target:r.v.name,t0:r.v.name+'（'+r.v.pop+'人）',eta:baseEta(r.direct?r.direct.dKm:20),res:'卫星便携站 ×1',note:'经北斗/天通二代直通建立保障链路。'});
  }
  const pdtRows=plan.rows.filter(r=>r.method==='pdt');
  if(pdtRows.length){tasks.push({t:'pdt',k:'PDT',title:'PDT 集群搭接配发',target:pdtRows.length+' 个村寨',t0:pdtRows.map(r=>r.v.name).join('、'),eta:baseEta(6),res:'PDT 车载/手持台 ×'+sc.resources.pdt,note:'点对点 350MHz 短链路集群组网，小口径保障。'});}
  const beoRows=plan.rows.filter(r=>r.method==='beidou');
  if(beoRows.length){tasks.push({t:'beidou',k:'北斗',title:'北斗短报文下发救援指令',target:beoRows.map(r=>r.v.name).join('、'),t0:beoRows.map(r=>r.v.name).join(' / '),eta:baseEta(2),res:'北斗终端 ×'+sc.resources.beidou,note:'单包 140 字节语义压缩下发，含救援集结点与回执。'});}
  const gens=[];
  const gN=Math.min(sc.resources.generator||2, sc.stationDown.length);
  for(const id of sc.stationDown){
    const st=STATIONS[id];const d=Math.hypot(85-st.x,300-st.y)*KMPP;
    if(gens.length>=gN)break;
    gens.push({t:'gen',k:'抢修',title:'基站抢修 / 油机保电',target:st.name,t0:'',eta:baseEta(d),res:'油机 ×2 + 抢修队 ×2',note:'恢复基站供电，解除覆盖缺口。'});
  }
  tasks.push(...gens);
  return tasks.sort((a,b)=>a.eta-b.eta);
}
function buildBeidou(sc,a){
  const top=(a&&a.rows&&a.rows[0])||null;
  const v=top?top.v:null;
  const lost=sc.lost||3;
  const inj=Math.max(1,Math.round((v?v.pop:600)*((top&&top.sev===3)?0.006:0.003)));
  const needs=v?(v.needs||[]):[];
  const nd=needs.map(n=>({'药品':'药','饮用水':'水','照明':'灯','食品':'食','帐篷':'棚','发电机':'电','保暖物资':'衣','医疗物资':'药'}[n]||n)).join('');
  const equip=top?(top.method==='sat'?'卫星站':top.method==='relay'?'中继':top.method==='micro'?'微波':'北斗'):'北斗';
  const d=simNow();
  const head=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  const fields=[
    {k:'head',v:head,keep:true},
    {k:'body',v:v?`${v.name}${v.pop}人失联${lost}h`:'—',keep:true},
    {k:'inj',v:v?`伤${inj}`:'',keep:true},
    {k:'need',v:v?`缺${nd}`:'',keep:true},
    {k:'gather',v:v?`集结点${v.gather}`:'',keep:true},
    {k:'contact',v:v?`联络${v.contact}`:'',keep:true},
    {k:'equip',v:`需${equip}`,keep:true},
    {k:'ack',v:'回执01',keep:true}
  ];
  let compressed=fields.filter(f=>f.keep).map(f=>f.v).join(' ');
  const dropped=[];
  while(new TextEncoder().encode(compressed).length>140){
    const idx=fields.findIndex(f=>f.keep&&(f.k==='contact'||f.k==='ack'||f.k==='gather'));
    if(idx<0)break;
    fields[idx].keep=false;dropped.push(fields[idx].k);
    compressed=fields.filter(f=>f.keep).map(f=>f.v).join(' ');
  }
  const raw='县应急管理局值班室：接'+(v?v.name+'村干部':'值班')+'报告，受'+sc.name+'影响，该村通信已完全中断约'+lost+'小时，村内共有'+(v?v.pop:'—')+'名群众受困，其中'+inj+'人受伤，急需'+(v?v.needs.join('、'):'药品')+'等物资。群众集结点设在'+(v?v.gather:'村集结点')+'，现场联络人'+(v?v.contact:'待确认')+'。请立即组织相关人员携带卫星通信设备前往支援，并尽快回复确认。特此通知。';
  const rawBytes=new TextEncoder().encode(raw).length;
  const bytes=new TextEncoder().encode(compressed).length;
  return {v,raw,compressed,dropped,bytes,limit:140,margin:140-bytes,rawBytes,droppedFields:dropped};
}

/* ================== 推演流水线 ================== */
async function startRun(){
  if(state.running)return;
  const token=++state.runToken;
  state.running=true;state.done=false;state.min=0;
  const sc=state.scenario;
  state.baseMs=parseBase(sc.base);
  const btnRun=$('#btnRun');btnRun.disabled=true;
  setStage(0);
  logf('sense','接入基站网管、气象、路况、北斗与 DEM 四类源数据');
  await sleep(400);if(token!==state.runToken)return;
  logf('sense',sc.stationDown.length+' 个基站退服，触发失联识别');
  await sleep(450);if(token!==state.runToken)return;
  setAgent('sense','完成','6 类数据源接入 · 融合完成');
  setStage(1);state.min=1;renderClock();
  logf('assess','开始逐村计算到指挥中心视距余隙与菲涅尔区');
  await sleep(420);if(token!==state.runToken)return;
  const a=analyze(sc);state.analysis=a;
  const rowMap={};(a.rows||[]).forEach(r=>{rowMap[r.v.id]=r;});
  const popV=a.rows.reduce((s,r)=>s+r.v.pop,0);
  const p1=a.rows[0];
  logf('assess','识别失联 '+a.rows.filter(r=>r.status==='中断').length+' 个村寨，影响人口 '+popV.toLocaleString('zh-CN')+' 人');
  logf('assess','保障对象 '+p1.v.name+' 为最高优先级 P1');
  await sleep(450);if(token!==state.runToken)return;
  setAgent('assess','完成','失联 '+a.rows.filter(r=>r.status==='中断').length+' 个 · 影响 '+popV.toLocaleString('zh-CN')+' 人');
  renderVillageList(rowMap);
  renderAssess(a);
  setStage(2);state.min=2;renderClock();
  const tPlan0=performance.now();
  const plan=buildPlan(sc,a);state.plan=plan;
  const planMs=Math.round(performance.now()-tPlan0);
  const best=plan.relay;
  logf('plan',best
    ?'中继点评估完成，候选 '+a.relays.length+' 个，最优 '+best.name+'，覆盖 '+best.covered.length+' 个失联村寨'
    :'中继点评估完成，候选 '+a.relays.length+' 个均无法在 12 km 内形成可用视距，直接转卫星/短报文');
  logf('plan','生成 '+plan.rows.length+' 条通信保障链路，链路求解耗时 '+(planMs<1?'<1':planMs)+' ms');
  await sleep(500);if(token!==state.runToken)return;
  setAgent('plan','完成',(function(){
    var ms=plan.rows.filter(r=>r.method!=='beidou'&&r.link&&r.link.margin!==null).map(r=>r.link.margin);
    return '链路 '+plan.rows.length+' 条 · '+(ms.length?'余量最弱 '+Math.min.apply(null,ms).toFixed(1)+' dB':'全部为北斗短报文');
  })());
  drawLinks(plan);
  renderLink(plan);
  renderAssess(a);
  setStage(3);state.min=3;renderClock();
  const tasks=buildTasks(sc,plan);state.tasks=tasks;
  renderTasks(tasks);
  logf('dispatch','按优先级生成 '+tasks.length+' 项调度任务，最早任务开始执行');
  await sleep(450);if(token!==state.runToken)return;
  setAgent('dispatch','完成','任务 '+tasks.length+' 项 · 卫星 '+sc.resources.satellite+' 套');
  const b=buildBeidou(sc,a);state.beidou=b;
  renderBeidou(b);
  logf('review','北斗短报文压缩 '+b.rawBytes+' B → '+b.bytes+' B，压缩率 '+Math.round(100*(1-b.bytes/b.rawBytes))+'%');
  setStage(4);state.min=4;renderClock();
  logf('review','生成复盘报告与恢复时间线');
  await sleep(400);if(token!==state.runToken)return;
  setAgent('review','完成','报告已生成 · 可追溯');
  setStage(5);state.min=4;renderClock();
  state.done=true;state.running=false;
  $('#btnRun').disabled=false;$('#btnExport').disabled=false;
  $('#logState').textContent='完成';$('#agentState').textContent='完成';
  const rep=buildReport(sc,plan,a,b,tasks);
  renderReport(rep);
  updateKpis();
  switchTab('link');
  await sleep(300);if(token!==state.runToken)return;
  logf('system','推演完成：通信保障方案已生成，等待人工确认后下达任务。','ok');
}

<script>
/* 地图拖动 / 滚轮缩放 / 双指缩放 / 双击复位 */
(function(){
  var stage=document.querySelector(".map-stage");
  var pan=document.getElementById("mapPan");
  if(!stage||!pan) return;
  var MIN=1,MAX=3.5,BASE=1.05;
  var s=BASE,tx=0,ty=0;
  var pointers=new Map(),dragging=false,moved=0,sx=0,sy=0,stx=0,sty=0,pinch=null;
  function box(){return {w:stage.clientWidth,h:stage.clientHeight};}
  function clamp(){
    var b=box(),minX=b.w-b.w*s,minY=b.h-b.h*s;
    tx=Math.min(0,Math.max(minX,tx));
    ty=Math.min(0,Math.max(minY,ty));
  }
  function apply(){
    clamp();
    pan.style.transform="translate("+tx.toFixed(2)+"px,"+ty.toFixed(2)+"px) scale("+s.toFixed(4)+")";
  }
  function zoomAt(ns,cx,cy){
    ns=Math.max(MIN,Math.min(MAX,ns));
    var k=ns/s;
    tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;s=ns;apply();
  }
  stage.addEventListener("wheel",function(e){
    e.preventDefault();
    var r=stage.getBoundingClientRect();
    zoomAt(s*Math.exp(-e.deltaY*0.0016),e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  stage.addEventListener("pointerdown",function(e){
    if(e.target.closest(".legend,.map-prog")) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){
      dragging=false;moved=0;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;
    }else if(pointers.size===2){
      var q=[];pointers.forEach(function(v){q.push(v);});
      pinch={d:Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),s:s,
             mx:(q[0].x+q[1].x)/2,my:(q[0].y+q[1].y)/2};
    }
  });
  stage.addEventListener("pointermove",function(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){
      var dx=e.clientX-sx,dy=e.clientY-sy;
      moved=Math.max(moved,Math.hypot(dx,dy));
      if(!dragging&&moved>3){
        dragging=true;stage.classList.add("is-dragging");
        try{stage.setPointerCapture(e.pointerId);}catch(_e){}
      }
      if(dragging){tx=stx+dx;ty=sty+dy;apply();}
    }else if(pointers.size===2&&pinch){
      var q=[];pointers.forEach(function(v){q.push(v);});
      var d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);
      var r=stage.getBoundingClientRect();
      if(pinch.d>0) zoomAt(pinch.s*(d/pinch.d),pinch.mx-r.left,pinch.my-r.top);
      moved=99;
    }
  });
  function end(e){
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinch=null;
    if(pointers.size===0){
      dragging=false;stage.classList.remove("is-dragging");
      try{stage.releasePointerCapture(e.pointerId);}catch(_e){}
    }
  }
  stage.addEventListener("pointerup",end);
  stage.addEventListener("pointercancel",end);
  stage.addEventListener("click",function(e){
    if(moved>4){e.stopPropagation();e.preventDefault();}
  },true);
  stage.addEventListener("dblclick",function(e){
    if(e.target.closest(".legend,.map-prog,.vnode,.stn")) return;
    s=BASE;var b=box();
    tx=(b.w-b.w*s)/2;ty=(b.h-b.h*s)/2;apply();
  });
  window.addEventListener("resize",apply);
  var b0=box();
  tx=(b0.w-b0.w*s)/2;ty=(b0.h-b0.h*s)/2;apply();
})();
</script>

<script>
/* 启动推演：0.5s 收到圆形 → 转圈 → 完成后 0.5s 展开 */
(function(){
  var btn=document.getElementById("btnRun");
  if(!btn) return;
  var busy=false;
  function collapse(){
    if(busy||btn.classList.contains("is-loading")) return;
    busy=true;
    var w=btn.offsetWidth,h=btn.offsetHeight;
    /* 先落成具体像素宽度，否则 auto 无法过渡 */
    btn.style.height=h+"px";
    btn.style.width=w+"px";
    void btn.offsetWidth;
    btn.classList.add("is-loading");
    btn.style.width=h+"px";
  }
  function expand(){
    if(!btn.classList.contains("is-loading")){busy=false;return;}
    var from=btn.style.width;
    btn.classList.remove("is-loading");
    btn.style.width="auto";
    var target=btn.offsetWidth;
    btn.style.width=from;
    void btn.offsetWidth;
    btn.style.width=target+"px";
    btn.style.height="";
    btn.addEventListener("transitionend",function te(e){
      if(e.propertyName!=="width") return;
      btn.style.width="";
      btn.removeEventListener("transitionend",te);
      busy=false;
    });
  }
  btn.addEventListener("click",function(){ collapse(); },true);
  new MutationObserver(function(){
    if(!btn.disabled) expand();
  }).observe(btn,{attributes:true,attributeFilter:["disabled"]});
})();
</script>

<script>
/* 重置：文字隐去 → 打勾动画 → 停 0.3s → 文字渐显 */
(function(){
  var btn=document.getElementById("btnReset");
  if(!btn) return;
  var busy=false;
  var check=btn.querySelector(".reset-check svg");
  btn.addEventListener("click",function(){
    if(busy) return;
    busy=true;
    check.style.animation="none";
    void check.offsetWidth;
    btn.classList.add("is-resetting");
    setTimeout(function(){
      check.style.animation="";
      btn.classList.add("is-checking");
      check.addEventListener("animationend",function onend(){
        check.removeEventListener("animationend",onend);
        setTimeout(function(){
          btn.classList.remove("is-checking");
          btn.classList.remove("is-resetting");
          setTimeout(function(){ busy=false; },260);
        },300);
      });
    },140);
  });
})();
</script>

</body>
